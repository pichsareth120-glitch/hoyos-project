# Render Blueprint Specification for HOYOS E-Commerce (Free Demo Tier)
# Documentation: https://render.com/docs/blueprint-spec
# NOTE: Render free PostgreSQL instances expire after 30 days unless upgraded.
# Free web services spin down after 15 minutes of inactivity and cold-start in ~30-50s.

services:
  - type: web
    name: hoyos-ecommerce
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /up
    # Container entrypoint automatically clears stale caches, runs database
    # migrations, seeds initial demo data, and links storage before server startup.
    envVars:
      - key: APP_NAME
        value: HOYOS
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://hoyos-ecommerce.onrender.com
      - key: ASSET_URL
        value: https://hoyos-ecommerce.onrender.com
      - key: HOYOS_DEMO_MODE
        value: "true"
      - key: HOYOS_ALLOW_PAYMENT_SIMULATION
        value: "true"
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: hoyos-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: hoyos-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: hoyos-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: hoyos-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: hoyos-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: hoyos-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: TRUSTED_PROXIES
        value: "*"

databases:
  - name: hoyos-db
    plan: free
    region: oregon
    databaseName: hoyos
    user: hoyos_user
